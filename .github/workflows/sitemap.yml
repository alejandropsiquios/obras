name: Generate sitemap

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: write

jobs:
sitemap:
name: Generate sitemap.xml
runs-on: ubuntu-latest

```
steps:

  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Generate sitemap
    id: sitemap
    uses: cicirello/generate-sitemap@v1
    with:
      base-url-path: https://alejandropsiquios.github.io/obras/
      path-to-root: .
      include-html: true
      include-pdf: false
      drop-html-extension: false
      date-only: true

  - name: Show sitemap statistics
    run: |
      echo "Sitemap: ${{ steps.sitemap.outputs.sitemap-path }}"
      echo "URLs: ${{ steps.sitemap.outputs.url-count }}"
      echo "Excluded: ${{ steps.sitemap.outputs.excluded-count }}"

  - name: Commit sitemap if changed
    run: |
      if git diff --quiet sitemap.xml; then
        echo "No changes to sitemap.xml"
      else
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add sitemap.xml
        git commit -m "Actualizar sitemap"
        git push
      fi
```
