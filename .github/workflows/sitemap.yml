```yaml
name: Generate sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    name: Generate sitemap.xml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap
        id: sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://alejandropsiquios.github.io/obras/
          path-to-root: .
          include-html: true
          include-pdf: false
          drop-html-extension: false
          date-only: true

      - name: Check generated sitemap
        run: |
          echo "Contenido de la raíz:"
          ls -la
          echo ""
          echo "Comprobando sitemap.xml:"
          if [ -f sitemap.xml ]; then
            echo "sitemap.xml EXISTE"
            echo ""
            echo "Primeras líneas:"
            head -20 sitemap.xml
          else
            echo "ERROR: sitemap.xml NO EXISTE"
            exit 1
          fi

      - name: Commit sitemap if changed
        run: |
          git status --short
          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar sitemap"
            git push
          fi
```
